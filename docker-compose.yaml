services:
  london_agent:
    build:
      context: agents 
      dockerfile: Dockerfile
      args:
        - AGENT_NAME=london_agent
    ports:
      - "8001:8000"
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /app/.key.json
      GOOGLE_CLOUD_PROJECT: $PROJECT_ID
      GOOGLE_CLOUD_LOCATION: $LOCATION
      GOOGLE_GENAI_USE_VERTEXAI: "TRUE"
      DATA_BACKEND_URL: "http://data_mcp:8002"
      OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: "true"
      OTEL_PYTHON_LOGGING_AUTO_INSTRUMENTATION_ENABLED: "true"
    volumes:
      - .key.json:/app/.key.json:ro

  ticket_agent:
    build:
      context: agents 
      dockerfile: Dockerfile
      args:
        - AGENT_NAME=ticket_agent
    ports:
      - "8002:8000"
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /app/.key.json
      GOOGLE_CLOUD_PROJECT: $PROJECT_ID
      GOOGLE_CLOUD_LOCATION: $LOCATION
      GOOGLE_GENAI_USE_VERTEXAI: "TRUE"
      OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: "true"
      OTEL_PYTHON_LOGGING_AUTO_INSTRUMENTATION_ENABLED: "true"
    volumes:
      - .key.json:/app/.key.json:ro

  data_mcp:
    build:
      context: london_data_mcp
      dockerfile: Dockerfile
    ports:
      - "8002:8002"
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: "/app/.key.json"
      GOOGLE_CLOUD_PROJECT: "${PROJECT_ID}"
      GOOGLE_CLOUD_LOCATION: "${LOCATION}"
      DB_TYPE: "postgres"
      POSTGRES_USER: "user"
      POSTGRES_PASSWORD: "password"
      POSTGRES_DB: "london_travel"
      POSTGRES_HOST: "postgres"
      POSTGRES_PORT: "5432"
    volumes:
      - .key.json:/app/.key.json:ro
    depends_on:
      - postgres

  syncer:
    build:
      context: data_syncer
      dockerfile: Dockerfile
    ports:
      - "8003:8001"
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: "/app/.key.json"
      GOOGLE_CLOUD_PROJECT: "${PROJECT_ID}"
      GOOGLE_CLOUD_LOCATION: "${LOCATION}"
      POSTGRES_USER: "user"
      POSTGRES_PASSWORD: "password"
      POSTGRES_DB: "london_travel"
      POSTGRES_HOST: "postgres"
      POSTGRES_PORT: "5432"
    volumes:
      - .key.json:/app/.key.json:ro
    depends_on:
      - postgres

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: "user"
      POSTGRES_PASSWORD: "password"
      POSTGRES_DB: "london_travel"
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d london_travel"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    environment:
      - API_BASE_URL=http://localhost:8001
    depends_on:
      - london_agent
      - ticket_agent

  fake_user:
    build:
      context: fake_user
    ports:
      - "8085:8080"
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /app/.key.json
      GOOGLE_CLOUD_PROJECT: $PROJECT_ID
      GOOGLE_CLOUD_LOCATION: $LOCATION
      GOOGLE_GENAI_USE_VERTEXAI: "TRUE"
      LONDON_AGENT_URL: "http://london_agent:8000"
    volumes:
      - .key.json:/app/.key.json:ro
    depends_on:
      - london_agent
      - ticket_agent