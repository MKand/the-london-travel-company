timeout: 7200s # 2hr
tags:
  - ci

steps:
- name: 'gcr.io/cloud-builders/docker'
  id: "build-agent-image"
  waitFor: ['-']
  dir: './agents'
  entrypoint: "sh"
  args:
    - -xe 
    - -c
    - |
      docker build \
         -t "${_REGION}-docker.pkg.dev/${_PROJECT_ID}/london-travel-agency/agent:lab-${SHORT_SHA}" \
         -t "${_REGION}-docker.pkg.dev/${_PROJECT_ID}/london-travel-agency/agent:${_IMAGE_TAG}" \
         --cache-from "${_REGION}-docker.pkg.dev/${_PROJECT_ID}/london-travel-agency/agent:${_IMAGE_TAG}" \
         .
- name: 'gcr.io/cloud-builders/docker'
  id: "push-agent-image"
  waitFor: [build-agent-image]
  entrypoint: "sh"
  args:
    - -xe 
    - -c
    - |
      docker push '${_REGION}-docker.pkg.dev/${_PROJECT_ID}/london-travel-agency/agent:lab-${SHORT_SHA}' && \
      docker push '${_REGION}-docker.pkg.dev/${_PROJECT_ID}/london-travel-agency/agent:${_IMAGE_TAG}'
- name: 'gcr.io/cloud-builders/docker'
  id: "build-frontend-image"
  waitFor: ['-']
  dir: './frontend'
  entrypoint: "sh"
  args:
    - -xe 
    - -c
    - |
      docker build \
         -t "${_REGION}-docker.pkg.dev/${_PROJECT_ID}/london-travel-agency/frontend:lab-${SHORT_SHA}" \
         -t "${_REGION}-docker.pkg.dev/${_PROJECT_ID}/london-travel-agency/frontend:${_IMAGE_TAG}" \
         --cache-from "${_REGION}-docker.pkg.dev/${_PROJECT_ID}/london-travel-agency/frontend:${_IMAGE_TAG}" \
         .
- name: 'gcr.io/cloud-builders/docker'
  id: "push-frontend-image"
  waitFor: [build-frontend-image]
  entrypoint: "sh"
  args:
    - -xe 
    - -c
    - |
      docker push '${_REGION}-docker.pkg.dev/${_PROJECT_ID}/london-travel-agency/frontend:lab-${SHORT_SHA}' && \
      docker push '${_REGION}-docker.pkg.dev/${_PROJECT_ID}/london-travel-agency/frontend:${_IMAGE_TAG}'
- name: 'gcr.io/cloud-builders/docker'
  id: "build-mcp-image"
  waitFor: ['-']
  dir: './london_data_mcp'
  entrypoint: "sh"
  args:
    - -xe 
    - -c
    - |
      docker build \
         -t "${_REGION}-docker.pkg.dev/${_PROJECT_ID}/london-travel-agency/data_mcp:lab-${SHORT_SHA}" \
         -t "${_REGION}-docker.pkg.dev/${_PROJECT_ID}/london-travel-agency/data_mcp:${_IMAGE_TAG}" \
         --cache-from "${_REGION}-docker.pkg.dev/${_PROJECT_ID}/london-travel-agency/data_mcp:${_IMAGE_TAG}" \
         .
- name: 'gcr.io/cloud-builders/docker'
  id: "push-mcp-image"
  waitFor: [build-mcp-image]
  entrypoint: "sh"
  args:
    - -xe 
    - -c
    - |
      docker push '${_REGION}-docker.pkg.dev/${_PROJECT_ID}/london-travel-agency/data_mcp:lab-${SHORT_SHA}' && \
      docker push '${_REGION}-docker.pkg.dev/${_PROJECT_ID}/london-travel-agency/data_mcp:${_IMAGE_TAG}'
- name: 'gcr.io/cloud-builders/docker'
  id: "build-syncer-image"
  waitFor: ['-']
  dir: './data_syncer'
  entrypoint: "sh"
  args:
    - -xe 
    - -c
    - |
      docker build \
         -t "${_REGION}-docker.pkg.dev/${_PROJECT_ID}/london-travel-agency/data_syncer:lab-${SHORT_SHA}" \
         -t "${_REGION}-docker.pkg.dev/${_PROJECT_ID}/london-travel-agency/data_syncer:${_IMAGE_TAG}" \
         --cache-from "${_REGION}-docker.pkg.dev/${_PROJECT_ID}/london-travel-agency/data_syncer:${_IMAGE_TAG}" \
         .
- name: 'gcr.io/cloud-builders/docker'
  id: "push-syncer-image"
  waitFor: [build-mcp-image]
  entrypoint: "sh"
  args:
    - -xe 
    - -c
    - |
      docker push '${_REGION}-docker.pkg.dev/${_PROJECT_ID}/london-travel-agency/data_syncer:lab-${SHORT_SHA}' && \
      docker push '${_REGION}-docker.pkg.dev/${_PROJECT_ID}/london-travel-agency/data_syncer:${_IMAGE_TAG}'

- name: 'gcr.io/cloud-builders/docker'
  id: "build-user-simulator-image"
  waitFor: ['-']
  dir: './fake_user'
  entrypoint: "sh"
  args:
    - -xe 
    - -c
    - |
      docker build \
         -t "${_REGION}-docker.pkg.dev/${_PROJECT_ID}/london-travel-agency/user_simulator:lab-${SHORT_SHA}" \
         -t "${_REGION}-docker.pkg.dev/${_PROJECT_ID}/london-travel-agency/user_simulator:${_IMAGE_TAG}" \
         --cache-from "${_REGION}-docker.pkg.dev/${_PROJECT_ID}/london-travel-agency/user_simulator:${_IMAGE_TAG}" \
         .
- name: 'gcr.io/cloud-builders/docker'
  id: "push-user-simulator-image"
  waitFor: [build-user-simulator-image]
  entrypoint: "sh"
  args:
    - -xe 
    - -c
    - |
      docker push '${_REGION}-docker.pkg.dev/${_PROJECT_ID}/london-travel-agency/user_simulator:lab-${SHORT_SHA}' && \
      docker push '${_REGION}-docker.pkg.dev/${_PROJECT_ID}/london-travel-agency/user_simulator:${_IMAGE_TAG}'

options:
  logging: CLOUD_LOGGING_ONLY
  substitution_option: ALLOW_LOOSE
  dynamic_substitutions: true